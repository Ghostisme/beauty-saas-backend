# ═══════════════════════════════════════════════════════════════════════
#  引导配置 —— 只在「首次签证书」这一步临时使用，签完就换成 20-beauty.conf
#
#  为什么需要它（鸡生蛋问题）：
#
#    完整版 20-beauty.conf 的 443 block 引用
#    /etc/letsencrypt/live/beauty.darkrich.com/fullchain.pem，而这张证书此刻
#    **还不存在**。因此完整版不能先装，否则 nginx -t 会因证书文件不存在
#    直接失败。
#
#    真正的问题是顺序：certbot 用 webroot(HTTP-01) 验证，需要先能通过
#    http://beauty.darkrich.com/.well-known/acme-challenge/ 取到文件，
#    也就是**必须先有 80 端口的 server 块**。而完整版里 80 和 443 写在
#    同一个文件，装完整版就等于同时引入了一个证书还没覆盖的 443 块。
#
#    所以拆成两步：先装这份只有 80 的，签完证书再替换成完整版。
#
#  ⚠️ 本文件刻意**不含 443 block**，也不 include security-headers ——
#     那里面有带 includeSubDomains 的一年期 HSTS，在证书还没覆盖本站时
#     发出去会把浏览器锁死在 HTTPS，反而让站点彻底打不开。
#
#  用法见 deploy/README.md §5.3。
# ═══════════════════════════════════════════════════════════════════════

server {
    listen 80;
    listen [::]:80;
    server_name beauty.darkrich.com;

    # certbot 把 challenge 文件写到这里。
    #
    # 本 block 的 server_name 是精确匹配，优先级高于 00-acme.conf 的
    # default_server，所以这段必须自带 —— 否则请求落到下面的 location /
    # 被 301 吃掉，certbot 只报 "Invalid response"，看不出根因。
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
        try_files $uri =404;
    }

    # 签证书阶段还没有 443 可跳，直接返回提示而不是 301 ——
    # 301 到一个证书还不匹配的 HTTPS 地址只会让浏览器报错，更难判断进度
    location / {
        add_header Content-Type text/plain;
        return 200 "beauty.darkrich.com: certificate pending\n";
    }
}
