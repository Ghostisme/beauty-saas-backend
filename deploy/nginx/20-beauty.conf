# ═══════════════════════════════════════════════════════════════════════
#  余乐圈美业 SaaS —— 宿主机 nginx 站点配置（VPS 临时部署）
#
#  文件名用 20- 前缀：VPS 上已有的 portfolio 站点都是 10-*.conf，
#  20- 表示这是后来加的临时站点，移除时一眼认得出该删哪个。
#
#  这一层只做四件事：TLS 终止、HSTS、80→443 跳转、把请求分流给两个容器。
#  **不碰任何文件系统** —— 静态文件由前端容器内的 nginx 托管，所以不需要
#  给 www-data 配 /opt/beauty-saas 的目录遍历 ACL（那是个容易踩的 403 坑）。
#
#  前后端各占一个独立的回环端口，公网仍只走标准的 80 / 443：
#
#      浏览器 ──443──▶ 宿主 nginx ──┬──▶ 127.0.0.1:19180  前端容器
#                                    └──▶ 127.0.0.1:19190  后端容器
#
#  两个端口都只绑 127.0.0.1，公网扫不到，不需要在防火墙放行。
#
#  /api 的分流走宿主机这一层直连后端，而不是穿前端容器再转一次 ——
#  少一跳代理，出问题时也更容易定位是哪一侧。
# ═══════════════════════════════════════════════════════════════════════

upstream beauty_web {
    server 127.0.0.1:19180;
    keepalive 16;
}

upstream beauty_api {
    server 127.0.0.1:19190;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name beauty.darkrich.com;

    # ⚠️ 这段是**必需**的，不能删。
    #
    #  本站证书走 webroot(HTTP-01)：签发和此后每次续期，Let's Encrypt 都要
    #  从 http://beauty.darkrich.com/.well-known/acme-challenge/ 取文件。
    #
    #  而本 block 的 server_name 是精确匹配，优先级高于 00-acme.conf 的
    #  default_server —— 一旦少了这段，challenge 请求会落到下面的
    #  `location /` 被 301 到 HTTPS，certbot 只报一句
    #  "Invalid response"，完全看不出根因是被自己的跳转吃掉了。
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # http2 写在 listen 上：独立的 http2 指令要 nginx ≥ 1.25.1，
    # 而 Debian 12 自带 1.22
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name beauty.darkrich.com;

    # ⚠️ 这里刻意使用 beauty 自己的证书 lineage。
    #
    #    现有 /etc/letsencrypt/live/darkrich.com/ 是 portfolio 五个正式站点
    #    共用的显式 SAN 证书（不是 wildcard）。beauty 是临时项目，不能用
    #    --expand 把它塞进主 lineage：以后下架 beauty、删 DNS 后，主证书
    #    按 lineage 续期会因 beauty 的 HTTP-01 验证失败而连带拖挂正式站点。
    #
    #    先用 20-beauty-bootstrap.conf 只开放 80 的 ACME challenge，签出
    #    /etc/letsencrypt/live/beauty.darkrich.com/ 后，再安装本完整配置。
    #    证书流程见 deploy/README.md §5.4。
    ssl_certificate     /etc/letsencrypt/live/beauty.darkrich.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/beauty.darkrich.com/privkey.pem;
    include /etc/nginx/snippets/portfolio-ssl.conf;
    include /etc/nginx/snippets/portfolio-security-headers.conf;

    access_log /var/log/nginx/beauty.access.log;
    error_log  /var/log/nginx/beauty.error.log;

    client_max_body_size 32m;

    # gzip 放在这一层统一做。前端容器里也配了 gzip，但对同一份响应不会
    # 重复压缩 —— 上游已经压过的内容这里会原样透传。
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss application/atom+xml image/svg+xml;

    # ── 后端 API ────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://beauty_api;
        include /etc/nginx/snippets/portfolio-proxy.conf;

        # 前端 request.ts 里设了 15 秒客户端超时，这里给到 120 秒是为了让
        # 首次请求能等过 Spring 冷启动 + Flyway 迁移；正常请求远快于此
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ── 前端 ────────────────────────────────────────────────────────
    #  SPA fallback、静态资源缓存头都在前端容器里做了，这里只转发。
    location / {
        proxy_pass http://beauty_web;
        include /etc/nginx/snippets/portfolio-proxy.conf;
    }
}
