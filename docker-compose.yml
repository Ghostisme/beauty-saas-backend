services:
  mysql:
    image: mysql:8.0
    container_name: beauty-saas-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: beauty_saas
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
      - ./src/main/resources/sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10
    networks:
      - beauty-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: beauty-saas-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/beauty_saas?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      JWT_SECRET: ${JWT_SECRET:-}
      PLATFORM_PROVISIONING_KEY: ${PLATFORM_PROVISIONING_KEY:-}
      PLATFORM_ADMIN_INITIAL_PASSWORD: ${PLATFORM_ADMIN_INITIAL_PASSWORD:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173}
      TZ: Asia/Shanghai
    volumes:
      - maven_cache:/root/.m2
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - beauty-network

networks:
  beauty-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  maven_cache:
    driver: local
